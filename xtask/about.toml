# cargo-about configuration for `cargo run -p xtask -- notices`.
# Only what ships: the app's run-time dependencies on every release target.
# Keep in step with `deny.toml`, which checks the same list in CI.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
]
targets = [
    "x86_64-pc-windows-msvc",
    "i686-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# MPL-2.0 for the spell checker only (ruling Y2).
[spellbook]
accepted = ["MPL-2.0"]

# egui's bundled fonts (ruling S6-T13-4).
[epaint_default_fonts]
accepted = ["OFL-1.1", "Ubuntu-font-1.0"]
