# Adapted from WordCraft (https://github.com/storytold/wordcraft,
# packaging/linux/flatpak/ai.storyteller.wordcraft.bundle.yml at aadb077), MIT OR Apache-2.0,
# used under Apache-2.0; changed: one binary, ReasonCraft's identity, no network and no Pictures
# access, and no from-source twin (that comes with a public repository).
#
# Flatpak manifest for the single-file bundle attached to every release
# (reasoncraft-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (reasoncraft-<version>-linux-<arch>.tar.gz,
# built on Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no
# network and no vendored crate sources during the build, and byte-for-byte the same binary as
# the AppImage, deb and rpm. The script unpacks the tarball into `stage/` next to a copy of this
# file. The binary needs glibc >= 2.35 and loads X11, Wayland, xkbcommon, EGL and GL at run time;
# the freedesktop runtime has all of them, and the GPU driver comes from its
# org.freedesktop.Platform.GL extension.
id: io.github.Patrick_Batenburg.ReasonCraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: reasoncraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open and Save dialogs go through the file-chooser portal (rfd's XDG portal backend), so
  # picked files work anywhere without broad filesystem access. Documents is granted so maps
  # passed by path (the command line, recent files) work in the usual place.
  - --filesystem=xdg-documents
  # Deliberately not granted: the network (the app works offline) and home or host filesystem
  # access.
modules:
  - name: reasoncraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/reasoncraft /app/bin/reasoncraft
      - install -Dm644 share/applications/io.github.Patrick_Batenburg.ReasonCraft.desktop /app/share/applications/io.github.Patrick_Batenburg.ReasonCraft.desktop
      - install -Dm644 share/mime/packages/io.github.Patrick_Batenburg.ReasonCraft.xml /app/share/mime/packages/io.github.Patrick_Batenburg.ReasonCraft.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/io.github.Patrick_Batenburg.ReasonCraft.metainfo.xml /app/share/metainfo/io.github.Patrick_Batenburg.ReasonCraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/reasoncraft /app/share/doc/
    sources:
      - type: dir
        path: stage
