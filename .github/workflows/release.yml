# Builds the installers for a version tag and keeps them as workflow
# artifacts. Nothing is published; see docs/release.md. Actions are
# pinned to commit SHAs (the tag they had is in the comment).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
            files: target/release/packager/*-setup.exe
          - os: macos-latest
            formats: app,dmg
            files: target/release/packager/*.dmg
          - os: ubuntu-latest
            formats: deb,appimage
            files: |
              target/release/packager/*.deb
              target/release/packager/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The toolchain pinned in rust-toolchain.toml.
      - name: Install the toolchain
        run: rustup toolchain install

      # egui's system libraries (the same as packaging/linux/Dockerfile).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev libgtk-3-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      # The AppImage tools run without FUSE when they unpack themselves.
      - name: Build the installers
        run: cargo packager --release -p reasoncraft --formats ${{ matrix.formats }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1

      # Named after the tag. A run by hand on a branch uses the commit
      # instead: a branch name may hold a '/', which an artifact name may not.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reasoncraft-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
