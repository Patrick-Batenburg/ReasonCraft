# Builds every release artifact with the scripts in packaging/ and, on the
# `release` branch, drafts a GitHub Release `v<version>` with them and
# SHA256SUMS.txt. A run by hand (workflow_dispatch) on another branch is a
# dry run: the artifacts and checksums stay workflow artifacts. Nothing is
# ever published; a maintainer reviews the draft and publishes it (see
# docs/release.md).
#
# No step that runs cargo has a signing secret in its environment: each
# platform builds in a step of its own and signs in the next (SEC-2).
# Signing runs when the secrets exist (the `release` environment on the
# `release` branch); without them each script warns and ships unsigned
# (ruling L3), and a partly configured set fails on `release` (PK-16). Each
# job's summary says how its files were signed. Self-contained: no reusable
# workflow. The script paths, arguments and artifact names keep to the
# interface of the Craft suite's reusable release workflow, so a later
# switch only changes this file (docs/release.md, "Compatibility").
# On `release` the draft job also attests the files' build provenance.
# Actions are pinned to commit SHAs (the tag they had is in the comment).
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  # On the release branch, signing secrets are all there or none (none:
  # unsigned with a warning, ruling PK-7); a partly configured set fails
  # the job instead of shipping unsigned or un-notarized (ruling PK-16).
  REASONCRAFT_REFUSE_PARTIAL_SIGNING: ${{ github.ref == 'refs/heads/release' && '1' || '' }}

jobs:
  # The version every job builds: the input (a leading "v" dropped), or
  # [workspace.package] version from Cargo.toml.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Also fails on `release` when v<version> is published already, before
      # anything is built (the draft job checks again before it touches the
      # release); elsewhere that is only a warning.
      - name: Read and check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          . packaging/env.sh
          input="${INPUT_VERSION#v}"
          case "$input" in
            *$'\r'* | *$'\n'*) echo "::error::the version input holds a line break"; exit 1 ;;
          esac
          # A release is drafted from Cargo.toml's version only: an input
          # version would draft a tag whose commit says otherwise in Cargo.toml.
          if [[ -n "$input" && "$GITHUB_REF" == refs/heads/release ]]; then
            echo "::error::no version input on the release branch; set the version with cargo xtask version set on main"
            exit 1
          fi
          version="${input:-$VERSION}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::'$version' is not X.Y.Z or X.Y.Z-pre"
            exit 1
          fi
          if published="$(gh release view "v$version" --json isDraft --jq '.isDraft | not' 2>/dev/null)"             && [[ "$published" == true ]]; then
            if [[ "$GITHUB_REF" == refs/heads/release ]]; then
              echo "::error::v$version is already published; bump the version on main first"
              exit 1
            fi
            echo "::warning::v$version is already published; this dry run cannot become its release"
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "ReasonCraft $version (pre-release: $prerelease)"

  windows:
    name: windows (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
    runs-on: windows-latest
    # A release build; x64 also a debug build for test-packaging-script.ps1.
    timeout-minutes: 90
    environment: ${{ github.ref == 'refs/heads/release' && 'release' || '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain pinned in rust-toolchain.toml; package.ps1 adds the target.
      - name: Install the toolchain
        run: rustup toolchain install

      - name: Set the version
        if: inputs.version != ''
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: cargo xtask version set $env:VERSION

      # WiX 5.0.2 exactly (MS-RL; later versions come with another licence),
      # its packages checked against pinned SHA-256s.
      - name: Install WiX
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'wix'
          ./packaging/windows/install-wix.ps1 -ToolPath $tools -Extensions UI, Util
          $tools >> $env:GITHUB_PATH

      # Without the signing secrets: no build script or proc macro sees them.
      # Also builds the xtask the next step runs, so that step compiles nothing.
      - name: Build the exe
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }} -BuildOnly

      - name: Sign and package the MSI and the portable zip
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }} -SkipBuild

      # The exe as shipped, from the zip (arm64: the windows-arm64-run job).
      - name: Run the shipped exe
        if: matrix.arch != 'arm64'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: ./packaging/windows/run-from-zip.ps1 -Zip "dist/release/reasoncraft-$env:VERSION-windows-$env:ARCH-portable.zip" -Version $env:VERSION

      # The packaging script's own checks: the build apart from the signing,
      # the policy check before signing,
      # the PE checks on the release exe (passes) and the debug exe (fails
      # the C runtime check), signing without secrets, and a pre-release's
      # MSI version. They need the x64 release exe from the step above and a
      # debug build.
      - name: Check the packaging script
        if: matrix.arch == 'x64'
        run: |
          cargo build -p reasoncraft
          if ($LASTEXITCODE -ne 0) { throw 'The debug build failed.' }
          ./packaging/windows/test-packaging-script.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          overwrite: true

  # The arm64 exe as shipped, on Windows on Arm (GitHub's windows-11-arm
  # runner, free for public repositories).
  windows-arm64-run:
    name: windows (arm64, run)
    needs: [version, windows]
    runs-on: windows-11-arm
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows-arm64
          path: ${{ runner.temp }}/arm64

      - name: Run the shipped exe
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./packaging/windows/run-from-zip.ps1 -Zip "$env:RUNNER_TEMP/arm64/reasoncraft-$env:VERSION-windows-arm64-portable.zip" -Version $env:VERSION

  macos:
    name: macos (universal)
    needs: version
    runs-on: macos-latest
    # Two release builds and two notarizations, which usually take minutes each
    # (notarytool would wait up to an hour); a slow Apple service can end the
    # job, which then runs again.
    timeout-minutes: 90
    environment: ${{ github.ref == 'refs/heads/release' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain pinned in rust-toolchain.toml; package.sh adds both targets.
      - name: Install the toolchain
        run: rustup toolchain install

      - name: Set the version
        if: inputs.version != ''
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: cargo xtask version set "$VERSION"

      # Without the signing secrets, and before the certificate is imported:
      # no build script or proc macro sees them or the unlocked keychain.
      - name: Build the binaries
        run: packaging/macos/package.sh --arch universal --build-only

      # Without APPLE_CERTIFICATE: a warning, and package.sh signs ad hoc.
      # The notarization credentials are passed only to check that the
      # certificate and they are all set or none.
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/import-cert.sh

      # Notarized only with a real identity and all three Apple credentials.
      - name: Sign and package the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh --arch universal --skip-build

      # Strict only when signing and notarization credentials are all set.
      - name: Verify the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/verify.sh --arch universal

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error
          overwrite: true

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then
            security delete-keychain "$MACOS_KEYCHAIN" || true
          fi

  linux:
    name: linux (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            nfpm-arch: x86_64
            nfpm-sha256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
          - arch: aarch64
            runner: ubuntu-24.04-arm
            nfpm-arch: arm64
            nfpm-sha256: 1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c
    runs-on: ${{ matrix.runner }}
    # Built in Ubuntu 22.04 (glibc 2.35), the image packaging/linux/Dockerfile
    # starts from, pinned by the same digest: the binary runs on that and
    # every newer distro. The job runs as root in it, so nothing needs sudo.
    container:
      image: ubuntu:22.04@sha256:e0f80c829509ef4df9e76bd8944eb7b8ec25cbb379b112a7f9448b2c77a77c9b
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # The same packages as packaging/linux/Dockerfile (git first, so that
      # the checkout is a git one).
      - name: Install Linux dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git \
            desktop-file-utils appstream zsync rpm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # nfpm 2.47.0, checked against the SHA-256 from its release's checksums.txt.
      - name: Install nfpm
        env:
          NFPM_ARCH: ${{ matrix.nfpm-arch }}
          NFPM_SHA256: ${{ matrix.nfpm-sha256 }}
        run: |
          file="nfpm_2.47.0_Linux_${NFPM_ARCH}.tar.gz"
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/$file" \
            "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/$file"
          echo "$NFPM_SHA256  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C /usr/local/bin nfpm
          nfpm --version

      # rustup (rustup-init checked against its pinned SHA-256), then the
      # toolchain pinned in rust-toolchain.toml.
      - name: Install the toolchain
        run: |
          packaging/linux/install-rustup.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install

      - name: Set the version
        if: inputs.version != ''
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: cargo xtask version set "$VERSION"

      # tar.gz, deb, rpm, and the AppImage with its .zsync (GITHUB_REPOSITORY
      # gives the update information).
      - name: Build the Linux packages
        run: packaging/linux/package.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          overwrite: true

  # The Flatpak bundle, repackaged from the linux job's tarball.
  flatpak:
    name: flatpak (${{ matrix.arch }})
    needs: [version, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      REASONCRAFT_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/linux

      # flatpak-builder needs unprivileged user namespaces, which Ubuntu
      # 24.04's AppArmor restricts by default; dbus-run-session gives
      # `flatpak run` (the smoke test) a session bus.
      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder librsvg2-common dbus
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the Flatpak bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          dbus-run-session -- packaging/linux/flatpak-bundle.sh \
            "$RUNNER_TEMP/linux/reasoncraft-$REASONCRAFT_VERSION-linux-$ARCH.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-flatpak-${{ matrix.arch }}
          path: dist/release/*.flatpak
          if-no-files-found: error
          overwrite: true

  # SHA256SUMS.txt over every artifact, and on the release branch their
  # build provenance and a draft release with them. A failed, timed-out or
  # cancelled job stops it.
  draft:
    name: checksums and draft release
    needs: [version, windows, windows-arm64-run, macos, linux, flatpak]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the draft release
      id-token: write # build provenance: the token Sigstore certifies
      attestations: write # build provenance: storing the attestation
    steps:
      # Every release-* artifact (the checksums artifact is named apart, so a
      # re-run never sums an old SHA256SUMS.txt).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Write SHA256SUMS.txt
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(*)
          if [ "${#files[@]}" -eq 0 ]; then echo "::error::no release artifacts"; exit 1; fi
          sha256sum -- "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true

      # A signed statement that GitHub Actions built each file from this
      # commit with this workflow; users check it with `gh attestation verify`.
      - name: Attest the build provenance
        if: github.ref == 'refs/heads/release'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt

      # Creates the draft, or refreshes its files and target commit. A
      # release already published under that tag is never touched.
      - name: Create or update the draft release
        if: github.ref == 'refs/heads/release'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          tag="v$VERSION"
          title="ReasonCraft v$VERSION"
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::$tag is already published; bump the version on main first"
              exit 1
            fi
            gh release edit "$tag" --draft --title "$title" --target "$GITHUB_SHA" \
              --prerelease="$PRERELEASE"
            gh release upload "$tag" --clobber -- *
          else
            gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" \
              --prerelease="$PRERELEASE" \
              --notes "See CHANGELOG.md for what changed. Check a download against SHA256SUMS.txt, or where it was built with \`gh attestation verify <file> --repo $GH_REPO\`." \
              -- *
          fi
