# Quick static checks of the release pipeline (no Rust build): the
# workflows, the packaging shell and PowerShell scripts, the XML sources,
# the Linux desktop entry and AppStream metadata, the WiX GUIDs, and the
# Windows install policy of MSI fixtures that are never installed.
#
# The windows-install-policy job is adapted from WordCraft
# (https://github.com/storytold/wordcraft, .github/workflows/packaging-lint.yml
# at aadb077), MIT OR Apache-2.0, used under Apache-2.0; changed: the
# folder names, comments and the checkout pin. The lint job is
# ReasonCraft's own.
# Actions are pinned to commit SHAs (the tag they had is in the comment).
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**", "app/reasoncraft/assets/icon*"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "app/reasoncraft/assets/icon*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the linters
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck libxml2-utils desktop-file-utils appstream rpm

      # actionlint 1.7.12, checked against the SHA-256 from its release's
      # checksums.txt. It runs shellcheck on the workflows' scripts too.
      - name: Workflows (actionlint)
        run: |
          file=actionlint_1.7.12_linux_amd64.tar.gz
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/$file" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$file"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$file" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Shell scripts (shellcheck)
        run: |
          shopt -s globstar
          shellcheck packaging/**/*.sh

      - name: XML sources (xmllint)
        run: |
          xmllint --noout \
            packaging/windows/*.wxs packaging/windows/*.wxi \
            packaging/macos/*.plist packaging/macos/Info.plist.in \
            packaging/linux/*.xml packaging/linux/*.xml.in

      - name: Desktop entry and AppStream metadata
        run: |
          desktop-file-validate packaging/linux/io.github.Patrick_Batenburg.ReasonCraft.desktop
          metainfo="$RUNNER_TEMP/io.github.Patrick_Batenburg.ReasonCraft.metainfo.xml"
          sed -e 's/@VERSION@/0.0.0/g' -e "s/@DATE@/$(date -u +%Y-%m-%d)/g" \
            packaging/linux/io.github.Patrick_Batenburg.ReasonCraft.metainfo.xml.in > "$metainfo"
          appstreamcli validate --no-net --explain "$metainfo"

      # A pre-release sorts before its release in dpkg and rpm: placeholder
      # packages (never installed) built with nfpm.yaml as 0.2.0-rc.1,
      # 0.2.0-rc.2 and 0.2.0. nfpm 2.47.0, checked against the SHA-256 from
      # its release's checksums.txt.
      - name: Pre-release version order (nfpm, dpkg, rpm)
        run: |
          file=nfpm_2.47.0_Linux_x86_64.tar.gz
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/$file" \
            "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/$file"
          echo "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  $RUNNER_TEMP/$file" \
            | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/$file" -C /usr/local/bin nfpm
          packaging/linux/check-version-order.sh

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem packaging/windows/*.ps1) {
            $tokens = $null; $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) {
              Write-Output "::error file=$($file.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      # Each GUID in the WiX sources (UpgradeCode, components) is used once.
      - name: WiX GUIDs are unique
        run: |
          dupes="$(grep -ohiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' \
            packaging/windows/*.wxs packaging/windows/*.wxi | tr '[:lower:]' '[:upper:]' | sort | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "::error::GUIDs used more than once in the WiX sources: $dupes"
            exit 1
          fi

  windows-install-policy:
    name: Windows install policy (no app build)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # WiX 5.0.2 exactly (MS-RL), with the extensions install-policy.json
      # names, its packages checked against pinned SHA-256s.
      - name: Install WiX
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'reasoncraft-install-policy-wix'
          $policy = Get-Content -Raw -LiteralPath packaging/windows/install-policy.json | ConvertFrom-Json
          ./packaging/windows/install-wix.ps1 -ToolPath $tools -Extensions @($policy.extensions)
          $tools >> $env:GITHUB_PATH

      # Builds MSI fixtures with text files in place of the exe and checks
      # their scope cases and registry contract; nothing is installed.
      - name: Build and check the install-policy fixtures
        shell: pwsh
        run: ./packaging/windows/test-install-policy.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'reasoncraft-install-policy-tests')
