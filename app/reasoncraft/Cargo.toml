[package]
name = "reasoncraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# `test-fixtures` also feeds the debug-only "Load sample map" command; the
# module is unused (and stripped) in release builds.
reasoncraft_core = { path = "../../crates/reasoncraft_core", features = ["test-fixtures"] }
eframe.workspace = true
serde.workspace = true
fluent-bundle = "0.16"
unic-langid = "0.9"
rfd = "0.17"
open = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }
base64 = "0.22"
arboard = { version = "3", default-features = false, features = ["image-data"] }
skrifa = "0.44"
svg2pdf = { version = "0.13", default-features = false, features = ["text", "image"] }
pdf-writer = "0.12"
docx-rs = { version = "0.4", default-features = false }

[dev-dependencies]
egui_kittest = "0.37"
reasoncraft_core = { path = "../../crates/reasoncraft_core", features = ["test-fixtures"] }
tempfile.workspace = true
serde_json.workspace = true
miniz_oxide = "0.8"
roxmltree = "0.20"
zip.workspace = true

[lints]
workspace = true
