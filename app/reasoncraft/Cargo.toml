[package]
name = "reasoncraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Map out arguments: claims, reasons and objections."
# Not published to crates.io: the About page embeds the workspace's
# THIRD-PARTY.md from outside this folder (see docs/release.md).
publish = false

[dependencies]
# `test-fixtures` also feeds the debug-only "Load sample map" command; the
# module is unused (and stripped) in release builds.
reasoncraft_core = { path = "../../crates/reasoncraft_core", features = ["test-fixtures"] }
reasoncraft_spell = { path = "../../crates/reasoncraft_spell" }
eframe.workspace = true
serde.workspace = true
fluent-bundle = "0.16"
# The OS language, the default UI language.
sys-locale = "0.3"
unic-langid = "0.9"
rfd = "0.17"
open = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }
base64 = "0.22"
arboard = { version = "3", default-features = false, features = ["image-data"] }
skrifa = "0.44"
svg2pdf = { version = "0.13", default-features = false, features = ["text", "image"] }
pdf-writer = "0.12"
docx-rs = { version = "0.4", default-features = false }
# Patches the core properties of Word files (and reads zips in tests).
zip.workspace = true
unicode-normalization = "0.1.26"
# Autosave: the recovery folder's meta files.
chrono = { workspace = true, features = ["serde"] }
serde_json.workspace = true

# Turns off the default app menu on macOS, whose Quit item would quit
# without asking about unsaved changes (the same winit eframe uses).
[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30", default-features = false }

[dev-dependencies]
egui_kittest = "0.37"
reasoncraft_core = { path = "../../crates/reasoncraft_core", features = ["test-fixtures"] }
tempfile.workspace = true
miniz_oxide = "0.8"
# Parses the .ftl files in the translation parity tests.
fluent-syntax = "0.12"
roxmltree = "0.20"
# Reads the packager configuration in the packaging tests.
toml = "1"

# The exe's icon and version information (Windows only).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true

# Installers, built with `cargo packager --release -p reasoncraft` (see
# docs/release.md). Paths are relative to this folder.
[package.metadata.packager]
product-name = "ReasonCraft"
identifier = "nl.reasoncraft.app"
publisher = "ReasonCraft contributors"
copyright = "Copyright (c) ReasonCraft contributors"
category = "Education"
# Both licence texts (see `cargo run -p xtask -- licence`).
license-file = "packaging/LICENSE.txt"
icons = ["assets/icons/icon-*.png", "assets/icon.ico", "assets/icon.icns"]
formats = ["nsis", "app", "dmg", "deb", "appimage"]
out-dir = "../../target/release/packager"
before-packaging-command = "cargo build --release -p reasoncraft -j 4"

[[package.metadata.packager.file-associations]]
extensions = ["rcraft"]
name = "ReasonCraft map"
description = "ReasonCraft map"
mime-type = "application/x-reasoncraft"
role = "editor"

[package.metadata.packager.nsis]
installer-mode = "currentUser"
# zlib: its decompressor in the installer is under the zlib licence.
compression = "zlib"
# The packager's own template, with the uninstaller removing the file
# association again (see the header of that file).
template = "packaging/windows/installer.nsi"

[package.metadata.packager.deb]
desktop-template = "packaging/linux/reasoncraft.desktop"
section = "editors"
files = { "packaging/linux/reasoncraft-mime.xml" = "usr/share/mime/packages/reasoncraft.xml" }

[package.metadata.packager.appimage]
files = { "packaging/linux/reasoncraft-mime.xml" = "usr/share/mime/packages/reasoncraft.xml" }
